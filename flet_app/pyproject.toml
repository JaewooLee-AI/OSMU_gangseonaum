[project]
name = "osmu-gangseonanum-flet"
version = "0.1.0"
description = "강서나눔돌봄센터 OSMU 워크벤치 — Flet 데스크톱 앱"
requires-python = ">=3.10"
dependencies = [
    "flet>=1.0.0",
    "python-dotenv>=1.0",
    "cryptography>=43.0",
    "openai>=1.40",
    "anthropic>=0.34",
    "google-genai>=1.0",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "playwright>=1.46",
    "pyperclip>=1.9",
    "Pillow>=10.0",
    "pywin32; platform_system == 'Windows'",
]

[tool.flet]
product = "OSMU 강서나눔 워크벤치"
org = "nanum1584"
company = "nanum1584"

# flet 1.0.2의 빌드 템플릿은 Flutter 패키지 jni를 1.0.0으로 고정(override)한다.
# jni_flutter 1.0.4부터는 generated_plugin.dart에 `JniVersionCheck(1, 1)`이 들어가
# jni 1.1 이상이 아니면 Dart 컴파일이 "Constant evaluation error"로 깨진다
# (1.0.4는 그래서 철회됐고 1.0.4+1은 jni ^1.1.0을 요구). 10/16 빌드가 이 오류로 실패했다.
# `JniVersionCheck(1, 0)`인 마지막 버전 1.0.3으로 고정한다(OSMU_cjc에서 같은 고정으로
# 빌드 성공 확인). flet을 jni 1.1을 쓰는 버전으로 올릴 때 이 고정도 같이 풀면 된다.
#
# shared_preferences_android도 같은 이유다. 2026-10-17에 나온 2.5.0부터 jni ^1.1.0을 쓰는 JNI 구현으로
# 바뀌어(messages.g.jni.dart) 같은 "Constant evaluation error"가 난다(OSMU_osw 2026-10-19 빌드에서 확인).
# jni를 쓰지 않는 마지막 버전 2.4.28(2026-08-28)로 고정한다. flet을 올릴 때 함께 푼다.
[tool.flet.flutter.pubspec.dependency_overrides]
jni_flutter = "1.0.3"
shared_preferences_android = "2.4.28"
